<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b2d5b"><title>Gemini Navigator｜載入中</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f3f6fa;color:#0b2d5b}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:480px;background:#fff;border:1px solid #d9e2ef;border-radius:20px;padding:28px;box-shadow:0 18px 48px rgba(11,45,91,.12)}.spin{width:42px;height:42px;margin:0 auto 18px;border:4px solid #dce8f7;border-top-color:#2875df;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{line-height:1.7;color:#52647d}</style></head><body><main><div class="box"><div class="spin"></div><h1>Gemini Navigator</h1><p id="status">正在載入互動網站…</p></div></main><script>(async()=>{try{const f=['p/0.txt','p/1.txt','p/2.txt','p/3.txt','p/4.txt','p/5.txt'],b=(await Promise.all(f.map(async x=>{const r=await fetch(x,{cache:'no-store'});if(!r.ok)throw Error(x);return r.text()}))).join(''),u=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('status').textContent='網站載入失敗，請重新整理。';console.error(e)}})();</script></body></html>
