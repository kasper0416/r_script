<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="title desc"><title id="title">TongueCare AI 產品原型</title><desc id="desc">展示影像拍攝、品質檢查、AI 輔助觀察、雙語結果與歷史紀錄的產品流程。</desc><defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#282824"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b7ff2a"/></marker></defs><rect width="920" height="700" fill="#10100f"/><rect width="920" height="700" fill="url(#g)"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="12" letter-spacing="2.5" fill="#92928a">PRODUCT CONCEPT / BILINGUAL ORAL-HEALTH ASSISTANT</text><g transform="translate(44 84)" font-family="Arial,sans-serif"><rect width="386" height="560" rx="22" fill="#f1efe9"/><rect x="0" y="0" width="386" height="74" rx="22" fill="#b7ff2a"/><rect x="0" y="52" width="386" height="22" fill="#b7ff2a"/><text x="24" y="33" font-size="19" font-weight="800" fill="#111">TongueCare AI</text><text x="24" y="54" font-size="10" letter-spacing="1.2" fill="#3f520e">影像觀察輔助 / EN・ZH</text><rect x="24" y="100" width="338" height="206" rx="14" fill="#1a1a18"/><ellipse cx="193" cy="206" rx="88" ry="64" fill="#c5523d"/><path d="M134 205Q193 248 252 205" fill="none" stroke="#f2a49a" stroke-width="5"/><circle cx="117" cy="121" r="9" fill="#b7ff2a"/><text x="142" y="329" font-size="11" fill="#6d6961">拍攝品質</text><rect x="220" y="318" width="142" height="14" rx="7" fill="#d2cec5"/><rect x="220" y="318" width="118" height="14" rx="7" fill="#b7ff2a"/><g transform="translate(24 359)"><rect width="338" height="66" rx="10" fill="#fff" stroke="#cbc6bc"/><circle cx="28" cy="33" r="13" fill="#b7ff2a"/><text x="52" y="27" font-size="12" font-weight="700">影像可用</text><text x="52" y="46" font-size="10" fill="#6d6961">亮度與構圖符合觀察條件</text></g><g transform="translate(24 439)"><rect width="162" height="80" rx="10" fill="#111"/><text x="16" y="27" font-size="10" fill="#a3a39a">OBSERVATION</text><text x="16" y="54" font-size="18" font-weight="700" fill="#fff">觀察結果</text></g><g transform="translate(200 439)"><rect width="162" height="80" rx="10" fill="#ded9d0"/><text x="16" y="27" font-size="10" fill="#6d6961">HISTORY</text><text x="16" y="54" font-size="18" font-weight="700" fill="#111">歷史紀錄</text></g></g><g transform="translate(490 94)" font-family="Arial,sans-serif"><text x="0" y="0" font-size="11" fill="#94948c" letter-spacing="2">SERVICE FLOW</text><g transform="translate(0 34)"><rect width="360" height="72" rx="10" fill="#1f1f1c" stroke="#55554f"/><circle cx="36" cy="36" r="18" fill="#f1efe9"/><text x="36" y="41" text-anchor="middle" font-size="12" font-weight="800">01</text><text x="72" y="29" fill="#fff" font-size="16" font-weight="700">拍攝引導</text><text x="72" y="51" fill="#96968f" font-size="11">距離、亮度、構圖與隱私提示</text></g><path d="M180 106V132" stroke="#b7ff2a" stroke-width="2.5" marker-end="url(#a)"/><g transform="translate(0 142)"><rect width="360" height="72" rx="10" fill="#1f1f1c" stroke="#55554f"/><circle cx="36" cy="36" r="18" fill="#f1efe9"/><text x="36" y="41" text-anchor="middle" font-size="12" font-weight="800">02</text><text x="72" y="29" fill="#fff" font-size="16" font-weight="700">影像品質檢核</text><text x="72" y="51" fill="#96968f" font-size="11">不合格先重拍，避免錯誤輸入</text></g><path d="M180 214V240" stroke="#b7ff2a" stroke-width="2.5" marker-end="url(#a)"/><g transform="translate(0 250)"><rect width="360" height="72" rx="10" fill="#b7ff2a"/><circle cx="36" cy="36" r="18" fill="#111"/><text x="36" y="41" text-anchor="middle" font-size="12" font-weight="800" fill="#b7ff2a">03</text><text x="72" y="29" fill="#111" font-size="16" font-weight="800">AI 輔助觀察</text><text x="72" y="51" fill="#40530b" font-size="11">模型輸出轉成可理解的觀察層級</text></g><path d="M180 322V348" stroke="#b7ff2a" stroke-width="2.5" marker-end="url(#a)"/><g transform="translate(0 358)"><rect width="360" height="72" rx="10" fill="#1f1f1c" stroke="#55554f"/><circle cx="36" cy="36" r="18" fill="#f1efe9"/><text x="36" y="41" text-anchor="middle" font-size="12" font-weight="800">04</text><text x="72" y="29" fill="#fff" font-size="16" font-weight="700">雙語結果與風險邊界</text><text x="72" y="51" fill="#96968f" font-size="11">Observation ≠ medical diagnosis</text></g><path d="M180 430V456" stroke="#b7ff2a" stroke-width="2.5" marker-end="url(#a)"/><g transform="translate(0 466)"><rect width="360" height="72" rx="10" fill="#1f1f1c" stroke="#55554f"/><circle cx="36" cy="36" r="18" fill="#f1efe9"/><text x="36" y="41" text-anchor="middle" font-size="12" font-weight="800">05</text><text x="72" y="29" fill="#fff" font-size="16" font-weight="700">建議與紀錄</text><text x="72" y="51" fill="#96968f" font-size="11">持續觀察、衛教資訊與就醫提醒</text></g></g></svg>