<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="title desc"><title id="title">政府與產業委託案治理架構</title><desc id="desc">展示政策目標、產業需求、技術內容、行政採購、執行資源與成果驗收的利害關係人關係。</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#292925"/></pattern></defs><rect width="920" height="700" fill="#10100f"/><rect width="920" height="700" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="42" y="46" fill="#999991" font-size="12" letter-spacing="2.4">PROGRAM GOVERNANCE / STAKEHOLDER ALIGNMENT</text><g stroke="#5a5a54" stroke-width="2" fill="none"><path d="M460 320L170 142"/><path d="M460 320L460 112"/><path d="M460 320L750 142"/><path d="M460 320L152 492"/><path d="M460 320L460 570"/><path d="M460 320L768 492"/></g><g transform="translate(460 320)"><circle r="110" fill="#b7ff2a"/><text text-anchor="middle" y="-25" fill="#40530d" font-size="11" letter-spacing="1.6">PROGRAM OFFICE</text><text text-anchor="middle" y="12" fill="#111" font-size="26" font-weight="800">整合與交付治理</text><text text-anchor="middle" y="42" fill="#334400" font-size="11">Scope / Schedule / Risk / Acceptance</text></g><g transform="translate(170 142)"><rect x="-104" y="-50" width="208" height="100" rx="12" fill="#f0eee8"/><text text-anchor="middle" y="-11" font-size="10" fill="#6d6961" letter-spacing="1.2">POLICY</text><text text-anchor="middle" y="22" font-size="20" font-weight="800">政策與委託目標</text></g><g transform="translate(460 112)"><rect x="-104" y="-50" width="208" height="100" rx="12" fill="#1f1f1c" stroke="#5a5a54"/><text text-anchor="middle" y="-11" font-size="10" fill="#999991" letter-spacing="1.2">INDUSTRY</text><text text-anchor="middle" y="22" font-size="20" font-weight="800" fill="#fff">產業需求與場域</text></g><g transform="translate(750 142)"><rect x="-104" y="-50" width="208" height="100" rx="12" fill="#1f1f1c" stroke="#5a5a54"/><text text-anchor="middle" y="-11" font-size="10" fill="#999991" let