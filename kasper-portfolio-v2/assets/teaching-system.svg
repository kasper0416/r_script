xt><text x="18" y="70" fill="#fff" font-size="16" font-weight="800">課後複用</text><text x="18" y="94" fill="#9d9d95" font-size="10">模板與工作流</text></g></g></g><g transform="translate(42 696)"><rect width="816" height="74" rx="12" fill="#f0eee8"/><text x="24" y="29" font-size="10" fill="#6d6961" letter-spacing="1.3">DELIVERABLE</text><text x="24" y="54" font-size="17" font-weight="800">Prompt＋資料＋操作步驟＋完成畫面＋KPI＋備援方案</text></g></g></svg>