<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">企業 AI 實作課程設計系統</title><desc id="desc">展示從工作痛點、材料、工具、Prompt、同步實作、成果畫面到課後複用的教學閉環。</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#292925"/></pattern><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b7ff2a"/></marker></defs><rect width="900" height="820" fill="#10100f"/><rect width="900" height="820" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="42" y="48" fill="#999991" font-size="12" letter-spacing="2.4">TEACHING SYSTEM / FROM PAIN POINT TO DELIVERABLE</text><g transform="translate(42 86)"><rect width="816" height="138" rx="16" fill="#b7ff2a"/><text x="28" y="34" font-size="10" letter-spacing="1.5" fill="#40530d">START WITH REAL WORK</text><text x="28" y="76" font-size="29" font-weight="800">不是教功能，而是解決三個工作痛點。</text><text x="28" y="108" font-size="12" fill="#40530d">情境、資料、限制與完成標準先定義，工具才有意義。</text></g><g transform="translate(42 258)"><g><rect width="232" height="126" rx="12" fill="#f0eee8"/><text x="20" y="29" font-size="9" fill="#6d6961" letter-spacing="1.2">01 / INPUT</text><text x="20" y="63" font-size="19" font-weight="800">真實材料</text><text x="20" y="88" font-size="10" fill="#6d6961">表格、文件、流程與案例</text></g><path d="M238 63H276" stroke="#b7ff2a" stroke-width="3" marker-end="url(#arr)"/><g transform="translate(282)"><rect width="232" height="126" rx="12" fill="#1f1f1c" stroke="#5b5b55"/><text x="20" y="29" font-size="9" fill="#999991" letter-spacing="1.2">02 / TOOL</text><text x="20" y="63" font-size="19" font-weight="800" fill="#fff">工具與 Prompt</text><text x="20" y="88" font-size="10" fill="#999991">Gemini / Sheets / NotebookLM</text></g><path d="M520 63H558" stroke="#b7ff2a" stroke-width="3" marker-end="url(#arr)"/><g transform="translate(564)"><rect width="252" height="126" rx="12" fill="#1