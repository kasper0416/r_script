<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="title desc"><title id="title">CubeSat 驗證與確認流程</title><desc id="desc">展示需求追溯、測試計畫、測試程序、模擬執行、測試證據與失效紀錄。</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#292925"/></pattern><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b7ff2a"/></marker></defs><rect width="920" height="700" fill="#11110f"/><rect width="920" height="700" fill="url(#grid)"/><text x="42" y="48" fill="#9a9a92" font-family="Arial,sans-serif" font-size="12" letter-spacing="2.5">SIMULATION-BASED VERIFICATION &amp; VALIDATION</text><g font-family="Arial,sans-serif"><path d="M112 116L350 350L112 584" fill="none" stroke="#696962" stroke-width="2"/><path d="M808 116L570 350L808 584" fill="none" stroke="#696962" stroke-width="2"/><path d="M350 350H570" stroke="#b7ff2a" stroke-width="4" marker-end="url(#arr)"/><g transform="translate(54 86)"><rect width="230" height="80" rx="10" fill="#f0eee8"/><text x="20" y="28" font-size="10" letter-spacing="1.3" fill="#6c6860">MISSION / SYSTEM</text><text x="20" y="57" font-size="21" font-weight="800">需求與成功準則</text></g><g transform="translate(112 234)"><rect width="230" height="80" rx="10" fill="#1f1f1c" stroke="#5b5b55"/><text x="20" y="28" font-size="10" letter-spacing="1.3" fill="#9c9c94">TEST DESIGN</text><text x="20" y="57" font-size="21" font-weight="800" fill="#fff">Test Plan</text></g><g transform="translate(232 400)"><rect width="230" height="80" rx="10" fill="#1f1f1c" stroke="#5b5b55"/><text x="20" y="28" font-size="10" letter-spacing="1.3" fill="#9c9c94">REPEATABLE STEPS</text><text x="20" y="57" font-size="21" font-weight="800" fill="#fff">Test Procedure</text></g><g transform="translate(340 310)"><rect width="240" height="80" rx="40" fill="#b7ff2a"/><text x="120" y="31" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#