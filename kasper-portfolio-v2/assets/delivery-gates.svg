<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 860" role="img" aria-labelledby="title desc"><title id="title">五階段交付 Gate</title><desc id="desc">從問題定義、規格形成、跨域整合、風險 Gate 到驗收交付的決策流程。</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#292925"/></pattern></defs><rect width="860" height="860" fill="#10100f"/><rect width="860" height="860" fill="url(#grid)"/><g font-family="Arial,sans-serif"><text x="42" y="48" fill="#999991" font-size="12" letter-spacing="2.4">DELIVERY GATES / DECISION EVIDENCE</text><g transform="translate(430 430)"><circle r="304" fill="none" stroke="#373732" stroke-width="54"/><circle r="238" fill="none" stroke="#474741" stroke-width="54"/><circle r="172" fill="none" stroke="#5b5b54" stroke-width="54"/><circle r="106" fill="none" stroke="#77776e" stroke-width="54"/><circle r="58" fill="#b7ff2a"/><text text-anchor="middle" y="-8" font-size="10" letter-spacing="1.4" fill="#40530d">OUTCOME</text><text text-anchor="middle" y="20" font-size="20" font-weight="800">可驗收交付</text></g><g fill="#f0eee8" font-size="12" font-weight="700"><text x="430" y="99" text-anchor="middle">01 DEFINE</text><text x="703" y="250" text-anchor="middle">02 STRUCTURE</text><text x="703" y="626" text-anchor="middle">03 INTEGRATE</text><text x="430" y="785" text-anchor="middle">04 GATE</text><text x="157" y="430" text-anchor="middle">05 VERIFY</text></g><g font-size="10" fill="#999991"><text x="430" y="119" text-anchor="middle">目標 / 限制 / 決策者</text><text x="703" y="270" text-anchor="middle">範圍 / 介面 / 驗收條件</text><text x="703" y="646" text-anchor="middle">團隊 / 供應商 / 行政流程</text><text x="430" y="805" text-anchor="middle">成本 / 時程 / 成熟度 / 風險</text><text x="157" y="450" text-anchor="middle">KPI / 測試 / 文件 / 證據</text></g><g fill="#b7ff2a"><circle cx="430" cy="126" r="8"/><circle cx="672" cy="285" r="8"/><circle cx="672" cy="575" r="8"/><circle cx="430" cy="734" r="8"/><circle cx="188" cy="430" r="8"/></g><g transform="translate(278 343)"><rect width="304" height="174" rx="16" fill="#181816" stroke="#606059"/><text x="152" y="38" text-anchor="middle" fill="#9d9d95" font-size="10" letter-spacing="1.4">EACH GATE REQUIRES</text><text x="24" y="76" fill="#fff" font-size="14">✓ 進入條件</text><text x="24" y="106" fill="#fff" font-size="14">✓ 退出條件</text><text x="168" y="76" fill="#fff" font-size="14">✓ 決策責任</text><text x="168" y="106" fill="#fff" font-size="14">✓ 驗證證據</text><text x="152" y="145" text-anchor="middle" fill="#b7ff2a" font-size="12">前進・補強・轉向・停止</text></g></g></svg>