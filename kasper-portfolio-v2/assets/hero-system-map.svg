<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc"><title id="title">系統整合決策圖</title><desc id="desc">將需求、規格、介面、風險、資源、驗收與交付串接為一個決策系統。</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#262622" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b7ff2a"/></marker></defs><rect width="820" height="760" fill="#10100f"/><rect width="820" height="760" fill="url(#grid)"/><text x="48" y="58" fill="#8f8f88" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">COMPLEX PROJECT SYSTEM MAP</text><text x="48" y="88" fill="#f0eee8" font-family="Arial,sans-serif" font-size="20" font-weight="700">從模糊需求到可驗收交付</text><g stroke="#5f5f59" stroke-width="1.5" fill="none"><path d="M410 380L182 202"/><path d="M410 380L410 150"/><path d="M410 380L638 202"/><path d="M410 380L176 538"/><path d="M410 380L410 620"/><path d="M410 380L644 538"/><circle cx="410" cy="380" r="184" stroke-dasharray="5 9"/><circle cx="410" cy="380" r="270" stroke="#343430"/></g><g font-family="Arial,sans-serif"><g transform="translate(410 380)"><circle r="108" fill="#b7ff2a" filter="url(#glow)" opacity=".18"/><circle r="83" fill="#b7ff2a"/><text text-anchor="middle" y="-12" font-size="13" letter-spacing="2.4" font-weight="800" fill="#1a1a17">KASPER</text><text text-anchor="middle" y="18" font-size="24" font-weight="800" fill="#10100f">整合與決策</text><text text-anchor="middle" y="44" font-size="11" letter-spacing="1.4" fill="#2d3c07">INTEGRATE → DECIDE → DELIVER</text></g><g transform="translate(182 202)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#f0eee8"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#6d6961">WHY / WHO</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#111">需求釐清</text></g><g transform="translate(410 150)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#1f1f1c" stroke="#77776f"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#9b9b93">WHAT / SCOPE</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#fff">規格形成</text></g><g transform="translate(638 202)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#1f1f1c" stroke="#77776f"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#9b9b93">SYSTEM / TEAM</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#fff">介面整合</text></g><g transform="translate(176 538)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#1f1f1c" stroke="#77776f"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#9b9b93">RISK / GATE</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#fff">風險控管</text></g><g transform="translate(410 620)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#1f1f1c" stroke="#77776f"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#9b9b93">TIME / COST</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#fff">資源配置</text></g><g transform="translate(644 538)"><rect x="-85" y="-45" width="170" height="90" rx="8" fill="#f0eee8"/><text text-anchor="middle" y="-9" font-size="12" letter-spacing="1.5" fill="#6d6961">EVIDENCE / KPI</text><text text-anchor="middle" y="21" font-size="22" font-weight="800" fill="#111">驗收交付</text></g></g><path d="M528 618C625 630 699 604 727 555" fill="none" stroke="#b7ff2a" stroke-width="3" marker-end="url(#arrow)"/><text x="584" y="666" fill="#b7ff2a" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">DECISION EVIDENCE</text><g font-family="Arial,sans-serif" font-size="10" fill="#8c8c84"><tex